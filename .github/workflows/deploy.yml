name: Deploy

# These steps used to come from koraykural-infra's deploy-static.yml. That
# repo is private now, and a public repo can't call a private repo's workflow.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pre-compress assets
        run: |
          find dist -type f \( \
            -name "*.html" -o -name "*.css" -o -name "*.js" \
            -o -name "*.json" -o -name "*.svg" -o -name "*.xml" \
            -o -name "*.txt" \
          \) | while read f; do
            gzip -k -9 "$f"
          done

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/
          target: /var/www/sorting-algorithm-visualizer.koraykural.com
          strip_components: 1
          rm: true
          debug: true
